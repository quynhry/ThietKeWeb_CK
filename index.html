<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yên Đan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo.png">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" sizes="180x180">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
        <img src = "assets/img/logo.png" alt ="Logo" style = "width: 80px; height: 80px"> 
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
            <i class="fa-solid fa-magnifying-glass" id="searchIcon" style="cursor: pointer;"></i>
       </div>
        <div class="account-cart">
            <div class="account">
                <i class="fa-regular fa-user"></i>
                <div id="accountSection">
                    <a href="pages/login.html" id="login-link">Đăng nhập / Đăng ký</a>
                    <span id="usernameDisplay" style="display: none;"></span>
                    <button id="logoutBtn" style="display: none;">Đăng xuất</button>
                </div>
            </div>
        </div>
<!-- Nút Giỏ Hàng -->
<button id="cart" style="position: relative; cursor: pointer;">
    <i class="fa fa-shopping-basket" aria-hidden="true"></i>
    Giỏ Hàng
    <span class="badge" style="
        position: absolute;
        top: -6px;
        right: -8px;
        background-color: #ef4444; /* Màu đỏ nhẹ */
        color: white;
        border-radius: 9999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
        min-width: 20px;
        text-align: center;
        display: none; /* Mặc định ẩn */
    ">0</span>
    </header>

    <!-- Nội dung trang -->

    <script src="./assets/js/search.js"></script>
</body>
</html>
